[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuner-livekit-sdk"
version = "0.1.9"
description = "Automatically ingest LiveKit Agents session data into the Tuner observability API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "usetuner", email = "support@usetuner.ai" },
]
requires-python = ">=3.10"
keywords = ["livekit", "agents", "voice-ai", "observability", "analytics", "tuner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "livekit-agents>=1.4",
    "tuner-langchain>=0.1.1",
]

[project.optional-dependencies]
# Forwarding OTel spans to Tuner (ENG-1233). An extra rather than a hard dependency:
# customers who do not want the Trace tab should not have to install the OTel SDK. The
# code degrades to a no-op when these are absent.
traces = [
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.urls]
Homepage     = "https://usetuner.ai"
Documentation = "https://docs.usetuner.ai"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "build",
    "twine",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tuner" = ["py.typed"]

